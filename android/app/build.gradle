plugins { id 'com.android.application' }

android {
    namespace 'io.github.ccremote.android'
    compileSdk 36
    defaultConfig {
        applicationId 'io.github.ccremote.android'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.1.0-preview.2'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    lint {
        abortOnError true
        warningsAsErrors true
        // Pinned, mutually compatible build/test tools; upgrades are separate reviewed changes.
        disable 'AndroidGradlePluginVersion', 'GradleDependency'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
